<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="No product image">
  <!--
    Brand-neutral on purpose: the container supplies `bg-muted`, so a
    transparent background lets one file sit correctly in light and dark, and
    keeps the placeholder from competing with the brand colour.
  -->
  <g fill="none" stroke="#9a9a9d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- basket -->
    <path d="M118 168h164l-16 118a20 20 0 0 1-20 18H154a20 20 0 0 1-20-18z" />
    <!-- handle -->
    <path d="M158 168v-14a42 42 0 0 1 84 0v14" />
    <!-- weave -->
    <path d="M150 210h100M156 244h88" stroke-width="7" opacity="0.7" />
  </g>

  <!-- leafy accent -->
  <g fill="#c9c9cd">
    <path d="M268 120c-28 4-48 22-52 48 26 4 48-10 56-30 4-9 2-14-4-18z" />
    <path d="M262 118c2 14 8 28 18 38" fill="none" stroke="#9a9a9d" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
